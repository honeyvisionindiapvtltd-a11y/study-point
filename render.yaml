services:
  - type: web
    name: study-point-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://studypointbbsr.in
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: deeptimayeep348@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: deeptimayeep348@gmail.com
      - key: ENQUIRY_RECIPIENT
        value: deeptimayeep348@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_FROM
        value: Study Point <onboarding@resend.dev>